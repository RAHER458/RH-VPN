<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14"><title>RH VPN — Генератор</title>
<style>
:root{color-scheme:dark;--bg:#080b14;--panel:#111a2b;--line:#293653;--muted:#91a0ba;--text:#f3f6ff;--blue:#5275ff;--purple:#9657ff;--green:#45d6a0;--red:#ff7185}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,#465bd233,transparent 38%),radial-gradient(ellipse at 90% 15%,#8941d222,transparent 32%),var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{display:flex;gap:12px;align-items:center;font-weight:800;letter-spacing:.08em}.logo{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 8px 30px #536bff55}.status{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:7px 12px;border-radius:99px}.hero{margin-bottom:25px}.eyebrow{font-size:11px;color:#9caeff;letter-spacing:.16em;text-transform:uppercase;font-weight:800}.hero h1{font-size:clamp(34px,7vw,52px);line-height:1.05;margin:10px 0}.grad{background:linear-gradient(100deg,#7895ff,#bd83ff);color:transparent;background-clip:text}.muted{color:var(--muted)}.panel{background:linear-gradient(160deg,#151e31,#0e1422);border:1px solid var(--line);border-radius:22px;padding:23px;margin:18px 0;box-shadow:0 18px 60px #0004}.panel h2{font-size:19px;margin:0 0 5px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:13px 11px;background:#0b1120;border:1px solid var(--line);border-radius:11px;color:var(--text);font:inherit;outline:none}.field input:focus{border-color:var(--blue)}.label{margin-top:12px}.btn{border:0;border-radius:12px;padding:13px 17px;font:inherit;font-weight:750;color:white;background:linear-gradient(100deg,var(--blue),var(--purple));cursor:pointer}.btn:disabled{opacity:.55}.btn.secondary{background:#202b43;border:1px solid var(--line)}.btn.danger{background:#542333;border:1px solid #874153;padding:8px 11px;font-size:12px}.full{width:100%;margin-top:8px}.note{font-size:12px;color:var(--muted);margin:12px 0 0}.result{display:none;margin-top:16px;padding:14px;border-radius:13px;border:1px solid #3d745f;background:#123326}.token{overflow-wrap:anywhere;font-family:ui-monospace,monospace;font-size:12px;margin:9px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.item{padding:15px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.item small{display:block;color:var(--muted)}.pill{font-size:11px;padding:4px 8px;border-radius:99px;background:#26334c;color:#cbd6ef}.pill.active{background:#164532;color:#8ef0c1}.pill.expired,.pill.revoked{background:#452332;color:#ff9caf}.error{color:#ff9caf;font-size:13px;margin-top:10px}.empty{color:var(--muted);font-size:13px;padding:15px 0}.foot{text-align:center;color:#64718a;font-size:11px;padding:25px}
@media(max-width:520px){.wrap{padding:17px}.panel{padding:18px}.grid{gap:7px}.field input{padding:12px 7px;font-size:14px}.row{align-items:flex-start}.top{margin-bottom:27px}}
</style></head><body><main class="wrap">
<header class="top"><div class="brand"><div class="logo">RH</div>RH VPN</div><div class="status" id="status">Подключение…</div></header>
<section class="hero"><div class="eyebrow">Personal VPN tools</div><h1>Твой VPN.<br><span class="grad">Твои правила.</span></h1><div class="muted">Генератор и управление сроками доступа.</div></section>
<section class="panel"><h2>Создать доступ</h2><div class="muted" style="font-size:13px">Укажи любой срок — можно комбинировать дни, часы, минуты и секунды.</div>
<div class="grid">
<div class="field"><label for="days">Дни</label><input id="days" type="number" min="0" step="1" value="0"></div>
<div class="field"><label for="hours">Часы</label><input id="hours" type="number" min="0" step="1" value="0"></div>
<div class="field"><label for="minutes">Минуты</label><input id="minutes" type="number" min="0" step="1" value="5"></div>
<div class="field"><label for="seconds">Секунды</label><input id="seconds" type="number" min="0" step="1" value="30"></div>
</div>
<div class="field label"><label for="label">Название (необязательно)</label><input id="label" type="text" maxlength="80" placeholder="Например, телефон или друг"></div>
<button class="btn full" id="create">Создать</button><div class="error" id="error"></div>
<div class="result" id="result"><b>Запись создана</b><div class="token" id="token"></div><button class="btn secondary" id="copy">Копировать токен</button><p class="note" id="warning"></p></div>
</section>
<section class="panel"><div class="row"><div><h2>Мои записи</h2><div class="muted" style="font-size:12px">Последние 200 созданных записей</div></div><button class="btn secondary" id="refresh">Обновить</button></div><div id="list" class="empty">Загрузка…</div></section>
<div class="foot">RH VPN · Личный инструмент</div></main>
<script>
const $=id=>document.getElementById(id);
let lastToken="";
function date(ts){return new Date(ts*1000).toLocaleString("ru-RU")}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{"content-type":"application/json",...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"Ошибка запроса");return d}
async function load(){try{const d=await api("/api/subscriptions");$("status").textContent="База подключена";if(!d.subscriptions.length){$("list").innerHTML='<div class="empty">Пока ничего не создано.</div>';return}
$("list").innerHTML=d.subscriptions.map(x=>'<div class="item"><div class="row"><div><b>'+escapeHtml(x.label||"Без названия")+'</b><small>Создано: '+date(x.created_at)+'</small><small>Истекает: '+date(x.expires_at)+'</small></div><div style="text-align:right"><span class="pill '+x.status+'">'+({active:"Активна",expired:"Истекла",revoked:"Отозвана"}[x.status])+'</span>'+(x.status==="active"?' <button class="btn danger" data-revoke="'+x.id+'">Отозвать</button>':"")+'</div></div></div>').join("");
document.querySelectorAll("[data-revoke]").forEach(b=>b.addEventListener("click",async()=>{if(!confirm("Отозвать этот доступ?"))return;try{await api("/api/subscriptions/"+b.dataset.revoke+"/revoke",{method:"POST",body:"{}"});await load()}catch(e){alert(e.message)}}))
}catch(e){$("status").textContent="Ошибка подключения";$("list").textContent=e.message}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("create").addEventListener("click",async()=>{const btn=$("create");$("error").textContent="";$("result").style.display="none";const values=["days","hours","minutes","seconds"].map(k=>Number($(k).value));if(values.some(v=>!Number.isSafeInteger(v)||v<0)){ $("error").textContent="Введи целые неотрицательные значения.";return}btn.disabled=true;btn.textContent="Создаю…";try{const d=await api("/api/subscriptions",{method:"POST",body:JSON.stringify({days:values[0],hours:values[1],minutes:values[2],seconds:values[3],label:$("label").value})});lastToken=d.token;$("token").textContent=lastToken;$("warning").textContent=d.message;$("result").style.display="block";await load()}catch(e){$("error").textContent=e.message}finally{btn.disabled=false;btn.textContent="Создать"}});
$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(lastToken);$("copy").textContent="Скопировано"}catch{$("copy").textContent="Не удалось скопировать"}});
$("refresh").addEventListener("click",load);load();
</script></body></html>
